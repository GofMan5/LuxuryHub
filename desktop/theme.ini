# Живая тема клиента. Правишь значения — сохраняешь — окно перекрашивается
# само, без пересборки и перезапуска (см. README, раздел «Живая разработка»).
#
# Формат: `ключ = #RRGGBB`, комментарии с `#`, отсутствующие ключи берутся
# из встроенной тёмной палитры lh-ui. Путь можно переопределить переменной
# окружения LUXURYHUB_THEME.

background     = #0E0F12
surface        = #13151A
surface_raised = #1A1D24
border         = #262A33
text           = #E9E4DA
text_muted     = #9A958C
accent         = #C8A24A
accent_soft    = #2A2415